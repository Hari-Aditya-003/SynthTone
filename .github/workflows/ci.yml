name: SynthTone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: SynthTone Syntax & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test requirements
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest fastapi soundfile

      - name: Compile Python modules
        run: |
          python -m py_compile app/db.py app/engines.py app/server.py tests/test_split.py

      - name: Run Unit Tests
        run: |
          pytest tests/
